[project]
name = "flypilot"
version = "0.1.0"
description = "A fixed fly brain model with a trained drone output mapping."
requires-python = ">=3.12,<3.13"
dependencies = [
  "genesis-world==1.4.0",
  "torch==2.10.0",
  "opencv-python==4.13.0.92",
  "imageio-ffmpeg==0.6.0",
  "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
