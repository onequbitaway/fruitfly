name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - name: Check movement and brain data
        run: swift run -c release FlyChecks
      - name: Build the app
        run: ./scripts/build.sh
      - name: Check every cell in the public recording
        run: make check-demo
      - name: Check the packaged app
        run: dist/Fruitfly.app/Contents/MacOS/Fruitfly --smoke-test
      - name: Build the full-map source
        run: swift build -c release --package-path experiments/full-map
      - name: Check the full-map cell equations without a data download
        run: swift run -c release --package-path experiments/full-map BrainChecks --kernel-only
      - uses: actions/upload-artifact@v4
        with:
          name: Fruitfly-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
