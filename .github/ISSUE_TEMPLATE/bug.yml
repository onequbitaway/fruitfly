name: Report a problem
description: Tell us what did not work.
body:
  - type: input
    id: version
    attributes:
      label: App version and macOS version
      placeholder: Fruitfly 0.1.0, macOS 14.7
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: List your steps. Describe what you expected and what happened.
    validations:
      required: true
